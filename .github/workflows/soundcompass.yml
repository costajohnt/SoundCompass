name: SoundCompass

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: soundcompass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-test:
    name: iOS build and test
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The runner image's default Xcode can lag the simulators the tests
      # need (an image update left the default at 16.4, with no iPhone 17
      # simulator). Use the newest non-beta Xcode installed on the runner.
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Prefer an iPhone 17 Pro simulator, else the first available iPhone,
      # so a runner image without that exact model still runs the tests.
      - name: Pick iOS simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items()
                  if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          pref = [d for d in devs if d["name"] == "iPhone 17 Pro"]
          print((pref or devs)[0]["udid"] if devs else "")
          ')
          if [ -z "$SIM_ID" ]; then
            echo "No iPhone simulator available" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"

      # `xcodebuild test` builds the app, the widget extension and the
      # test bundle, so a separate build step would only repeat the work.
      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SoundCompass.xcodeproj \
            -scheme SoundCompass-iOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath build/TestResults.xcresult | xcpretty

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/TestResults.xcresult
          retention-days: 7

  watchos-build:
    name: watchOS build
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # The watch app and complication are not part of the iOS scheme, so
      # without this job they would never be compiled by CI.
      - name: Build watch app and complication
        run: |
          set -o pipefail
          xcodebuild build \
            -project SoundCompass.xcodeproj \
            -scheme SoundCompass-watchOS \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO | xcpretty
