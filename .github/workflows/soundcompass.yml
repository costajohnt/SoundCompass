name: SoundCompass

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: soundcompass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-test:
    name: iOS build and test
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # `xcodebuild test` builds the app, the widget extension and the
      # test bundle, so a separate build step would only repeat the work.
      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SoundCompass.xcodeproj \
            -scheme SoundCompass-iOS \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath build/TestResults.xcresult | xcpretty

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/TestResults.xcresult
          retention-days: 7

  watchos-build:
    name: watchOS build
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # The watch app and complication are not part of the iOS scheme, so
      # without this job they would never be compiled by CI.
      - name: Build watch app and complication
        run: |
          set -o pipefail
          xcodebuild build \
            -project SoundCompass.xcodeproj \
            -scheme SoundCompass-watchOS \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO | xcpretty
